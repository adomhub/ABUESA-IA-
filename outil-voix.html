<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outil voix ABUESA</title>
<style>
:root{color-scheme:light;--bg:#f6f1e7;--ink:#111;--g:#2f5d1a;--b:#8a3b12}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.4 system-ui,sans-serif;padding:14px 16px 40px}
h1{font-size:22px;margin:4px 0 8px}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0002}
.entry{font-size:28px;font-weight:700;color:var(--b)} .ak{font-size:26px;color:var(--g);font-weight:700}
.cat{font-size:15px;opacity:.7}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;margin:5px 4px 5px 0;background:#e9e2d2;color:#111}
button.big{display:block;width:100%;background:var(--g);color:#fff;font-size:24px;padding:22px 10px}
button.skip{background:#d9c27a}
button.warn{background:#c9b2a6}
audio{width:100%}
textarea{width:100%;height:120px;font-size:13px}
small{opacity:.75}
</style></head><body>
<h1>🎙️ Outil voix ABUESA</h1>
<div class="card"><small>Écoute ta voix. Quand tu entends que <b>le mot affiché</b> commence, appuie sur le gros bouton vert. Si tu entends un <b>titre de catégorie</b> (Nature, Corps humain…), appuie sur le bouton jaune.</small></div>
<audio id="a" controls preload="auto" src="voix-lexique.mp3"></audio>
<div class="card">
  <div class="cat" id="cat"></div>
  <div class="entry" id="fr"></div>
  <div class="ak" id="ak"></div>
  <div><small id="prog"></small></div>
</div>
<button class="big" id="go">▶ Il commence MAINTENANT</button>
<button class="skip" id="skip">⏭ C'est un titre (ignorer)</button>
<button id="undo" class="warn">↩ Annuler</button>
<button id="back">⏪ −5 s</button>
<button id="slow">Vitesse : 1×</button>
<div class="card"><small id="last">Aucun repère pour l'instant.</small></div>
<div class="card" id="outbox" style="display:none">
  <b>Terminé ! Copie ce texte et colle-le dans le chat :</b>
  <textarea id="out" readonly></textarea>
  <button id="copy">📋 Copier</button>
</div>

const SEG=[1.82, 3.88, 5.58, 7.26, 8.24, 9.34, 12.12, 13.92, 15.84, 20.14, 23.26, 25.08, 28.54, 30.6, 32.52, 35.4, 36.96, 38.88, 40.36, 42.0, 46.1, 48.0, 50.18, 52.68, 53.5, 55.42, 56.16, 58.8, 61.32, 63.36, 64.18, 67.56, 68.94, 71.98, 75.7, 77.16, 79.9, 82.26, 84.34, 85.68, 86.86, 88.32, 90.1, 94.3, 96.24, 98.66, 101.52, 102.76, 103.64, 106.68, 107.88, 112.24, 114.28, 115.94, 118.36, 120.04, 120.76, 123.04, 123.88, 125.32, 127.38, 128.0, 130.8, 131.4, 133.98, 136.0, 137.34, 139.48, 143.12, 145.6, 147.88, 150.16, 152.38, 153.88, 156.66, 159.16, 160.48, 163.72, 166.8, 171.32, 172.94, 174.22, 176.48, 179.22, 181.0, 183.16, 185.06, 186.38, 187.34, 189.84, 192.12, 194.14, 195.84, 197.38, 199.9, 203.26, 205.68, 209.7, 211.8, 213.72, 215.56, 217.9, 219.96, 222.4, 224.88, 230.26, 235.66, 237.6, 238.56, 239.52, 241.38, 243.48, 245.52, 247.56, 248.98, 251.38, 253.2, 254.98, 257.2, 258.84, 260.88, 262.98, 264.76, 266.64, 268.44, 271.08, 273.48, 275.04, 275.5, 277.2, 279.4, 280.68, 281.88, 284.64, 286.68, 287.84, 290.1, 291.96, 294.42, 296.3, 298.06, 300.68, 303.32, 305.88, 307.28, 309.8, 311.88, 313.14, 314.0, 315.78, 317.36, 319.66, 322.04, 324.32, 326.48, 328.9, 330.8, 333.2, 336.54, 338.6, 341.02, 341.6, 344.5, 348.56, 349.76, 350.3, 352.0, 355.08, 356.26, 358.2, 360.84, 363.36, 365.08, 367.08, 368.88, 369.32, 371.24, 371.98, 374.72, 378.98, 381.7, 383.68, 386.04, 387.48, 388.8, 389.96, 391.18, 392.02, 392.64, 394.78, 396.46, 398.32, 399.96, 402.0, 403.76, 405.84, 407.64, 409.8, 411.62, 414.1, 416.84, 417.84, 418.7, 420.38, 421.18, 422.88, 423.84, 425.14, 427.8, 429.42, 430.96, 434.56, 437.32, 439.8, 441.04, 443.56, 445.12, 451.96, 455.2, 456.84, 459.04, 460.84, 463.08, 465.52, 469.38, 471.4, 474.98, 476.8, 478.6, 480.32, 481.94, 483.62, 485.6, 487.38, 489.02, 490.92, 492.46, 494.54, 495.74, 497.78, 499.3, 501.2, 502.34, 504.24, 507.86, 509.32, 511.38, 513.16, 515.32, 516.52, 518.86, 520.52, 522.04, 524.1, 525.9, 529.24, 531.3, 533.52, 535.12, 537.2, 540.38, 541.36, 542.48 const a=document.getElementById('a');
let marks=[],skips=[],log=[];  // log: pile des actions
try{const s=JSON.parse(localStorage.getItem('abuesa_voix')||'null'); if(s&&s.marks){marks=s.marks;skips=s.skips||[];log=s.log||[];}}catch(e){}
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem('abuesa_voix',JSON.stringify({marks,skips,log}))}catch(e){}}
function snap(t){ // dernier début de segment dans [t-2.0 ; t+0.15]
  let best=null;
  for(const s of SEG){ if(s<=t+0.15 && s>=t-2.0) best=s; }
  const prev=Math.max(marks.length?marks[marks.length-1]:-1, skips.length?skips[skips.length-1]:-1);
  if(best===null||best<=prev+0.25) best=Math.max(t-0.4,0);
  return Math.round(best*100)/100;
}
function render(){
  const i=marks.length;
  if(i>=ENT.length){$('cat').textContent='';$('fr').textContent='✅ Tous les mots sont repérés';$('ak').textContent='';$('prog').textContent=ENT.length+' / '+ENT.length;finish();return;}
  const e=ENT[i]; $('cat').textContent=e[0]; $('fr').textContent=e[1]; $('ak').textContent=e[2];
  $('prog').textContent='Mot '+(i+1)+' sur '+ENT.length;
  const lm=log.length?log[log.length-1]:null;
  $('last').textContent=lm?('Dernier repère : '+lm.t.toFixed(1)+' s ('+(lm.k==='m'?'mot':'titre')+')'):'Aucun repère pour l\'instant.';
}
function finish(){
  $('outbox').style.display='block';
  $('out').value=JSON.stringify({marks,skips});
}
$('go').onclick=()=>{ if(marks.length>=ENT.length)return; const t=snap(a.currentTime); marks.push(t); log.push({k:'m',t}); save(); render(); };
$('skip').onclick=()=>{ const t=snap(a.currentTime); skips.push(t); log.push({k:'s',t}); save(); render(); };
$('undo').onclick=()=>{ const l=log.pop(); if(!l)return; if(l.k==='m')marks.pop(); else skips.pop(); save(); $('outbox').style.display='none'; render(); };
$('back').onclick=()=>{ a.currentTime=Math.max(0,a.currentTime-5); };
let sp=[1,0.85,0.7,1.25],si=0;
$('slow').onclick=()=>{ si=(si+1)%sp.length; a.playbackRate=sp[si]; $('slow').textContent='Vitesse : '+sp[si]+'×'; };

render();
