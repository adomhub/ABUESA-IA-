name: Application CLAVIER IKPOSSO WABUƐ (Android)
on:
  push:
    paths:
      - 'android-clavier/**'
      - '.github/workflows/application-clavier.yml'
  schedule:
    - cron: '47 3 * * 1'   # chaque lundi : reprend les nouveaux mots
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Liste des mots ikposso
        run: |
          python3 dictionnaire-ikposso/fabriquer_liste.py
          mkdir -p android-clavier/app/src/main/assets
          cp dictionnaire-ikposso/source/wordlist.tsv android-clavier/app/src/main/assets/mots.tsv
      - name: Fabriquer l'application
        working-directory: android-clavier
        run: gradle assembleRelease -Pvc=${{ github.run_number }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: clavier-ikposso-wabue-apk
          path: android-clavier/app/build/outputs/apk/release/*.apk
      - name: Publier l'application dans le site
        run: |
          mkdir -p clavier
          cp android-clavier/app/build/outputs/apk/release/app-release.apk clavier/clavier-ikposso-wabue.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add clavier/clavier-ikposso-wabue.apk
          git commit -m "Application CLAVIER IKPOSSO WABUƐ : nouvelle version" || echo "Rien de neuf"
          git pull --rebase --autostash
          git push
