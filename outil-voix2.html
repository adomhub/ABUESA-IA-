function save(){try{localStorage.setItem('abuesa_voix2',JSON.stringify({marks,skips,log}))}catch(e){}}
function snap(t){ // dernier début de segment dans [t-2.0 ; t+0.15]

  for(const s of SEG){ if(s<=t+0.15 && s>=t-2.0) best=s; }

}
