plugins { id 'com.android.application' }
android {
    namespace 'tg.wabue.clavier'
    compileSdk 34
    defaultConfig {
        applicationId 'tg.wabue.clavier'
        minSdk 21
        targetSdk 34
        versionCode((project.findProperty('vc') ?: '1') as Integer)
        versionName '1.0.' + (project.findProperty('vc') ?: '1')
    }
    def cle = System.getenv('WABUE_CLE')
    signingConfigs {
        wabue {
            storeFile rootProject.file('wabue-cle.p12')
            storeType 'pkcs12'
            storePassword cle ?: ''
            keyAlias 'wabue'
            keyPassword cle ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // clé définitive WABUƐ si le secret WABUE_CLE existe, sinon clé de test
            signingConfig cle ? signingConfigs.wabue : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
